name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ticketwatch
          POSTGRES_USER: ticketwatch
          POSTGRES_PASSWORD: ticketwatch
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ticketwatch -d ticketwatch"
          --health-interval 5s --health-timeout 3s --health-retries 15
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://ticketwatch:ticketwatch@localhost:5432/ticketwatch?schema=public
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci-only-not-a-production-secret-32chars
      WHATSAPP_PROVIDER: console
      RUN_INTEGRATION: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:deploy
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
